version: '3.8'
services:
  scraper:
    build:
      context: ./scraper
      dockerfile: Dockerfile
    image: my-scraper:latest
    container_name: daily_scraper
    env_file:
      - ./scraper/.env
    volumes:
      - ./logs:/logs
      - ./data:/app/data
    restart: "no"
    stop_grace_period: 45s
    tty: true
    stdin_open: true
    profiles:
      - scraper
      - all

  chat:
    build:
      context: ./chat
      dockerfile: Dockerfile
    image: rental-chatbot:latest
    container_name: telegram_chatbot
    env_file:
      - ./chat/.env
    restart: unless-stopped
    profiles:
      - chat
      - all 